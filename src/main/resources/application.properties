# H2 - dosya tabanli, kullanicinin ana dizininde (Program Files gibi
# yazma izni olmayan klasorlere kurulum yapilsa bile calismaya devam
# eder). MODE=PostgreSQL, Postgres'ten kalan herhangi bir sozdizimi
# farkini da tolere etmesi icin ekstra bir guvenlik agi.
spring.datasource.url=jdbc:h2:file:${user.home}/.tarimicmal/data/tarimicmal;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate/JPA KULLANMIYORUZ (JdbcTemplate kullaniyoruz), bu yuzden
# bu satirlara gerek yok - ama ileride JPA eklemek istersen su ayari
# unutma: ddl-auto=none, cunku v_icmal bir VIEW, Hibernate'in ona
# tablo gibi davranip degistirmeye calismasini istemeyiz.

# Sunucu portu (istersen degistir)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Flyway: flyway-core classpath'te oldugu icin otomatik aktif, ekstra
# ayar gerekmiyor - varsayilan olarak src/main/resources/db/migration
# klasorunu okuyup uygulama her acildiginda sirayla calistirir.
#
# baseline-on-migrate=true: veritabaninda zaten (elle olusturulmus)
# tablolar var ama Flyway'in kendi takip tablosu (flyway_schema_history)
# yok - bu ayar olmadan Flyway guvenlik amacli durur. Bu ayarla, "buradan
# itibaren sen yonet, oncesini ben elle yaptim" demis oluyoruz.
# baseline-version=0: baseline noktasini en basa (0) koyuyoruz ki V1, V2
# ve R__ migration'larimizin HEPSI normal sekilde calissin (hicbiri
# "baseline oncesi" sayilip atlanmasin) - zaten hepsi IF NOT EXISTS /
# CREATE OR REPLACE kullandigi icin var olan tablolarla catismaz.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# SSL KALDIRILDI: Tek kullanicili, sadece localhost'ta calisan bir
# masaustu uygulamasinda kendinden imzali sertifika gercek bir guvenlik
# saglamiyordu, sadece karmasiklik (ve o "flaky" reload sorununu)
# ekliyordu. Artik duz http uzerinden calisiyoruz.
server.port=8080
